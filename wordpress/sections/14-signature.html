<!-- ============================================================
     KURNIA SEAFOOD · SIGNATURE GATEWAY (pintu masuk ke landing page
     "Kurnia Seafood Signature" — tier fine dining, outlet baru 2026).
     Palet resmi Signature: navy #0A2644 · gold #C29B44 · putih
     (lihat brand/SIGNATURE-BRAND.md).
     Strip foto = render dari window.KS_MENU (item signature:true) — bila
     data tak ada, strip disembunyikan (section tetap tampil).
     Tujuan tombol = window.KS_CONFIG.SIGNATURE_URL (fallback ke
     ../signature/index.html untuk preview repo).
     PRASYARAT: data/config.js & data/menu.js dimuat sebelum section ini.
     ============================================================ -->
<section class="ks-sig" id="signature">
  <div class="ks-sig__inner">
    <span class="ks-sig__kicker">Sebuah Persembahan Baru</span>

    <!-- Logo resmi Kurnia Seafood Signature. Saat pasang di WordPress, ganti src
         dengan URL media library (file: signature/assets/logo-kurnia-signature-dark.png) -->
    <div class="ks-sig__mark">
      <img src="../signature/assets/logo-kurnia-signature-dark.png" alt="Kurnia Seafood Signature"
           width="1200" height="802" loading="lazy">
    </div>

    <p class="ks-sig__sub">Tier fine dining dari keluarga Kurnia — persembahan terbaik laut
      Nusantara, disajikan dengan seremoni.</p>

    <p class="ks-sig__cities">
      <span>Bandung · September 2026</span>
      <i aria-hidden="true">✦</i>
      <span>Jakarta · Akhir 2026</span>
    </p>

    <div class="ks-sig__grid" hidden></div>

    <a class="ks-sig__btn" href="../signature/index.html" data-signature-link>Discover Kurnia Signature</a>
    <span class="ks-sig__eta">Segera hadir — bergabunglah ke priority list</span>
  </div>

  <style>
  .ks-sig{
    /* palet resmi Kurnia Seafood Signature (brand/SIGNATURE-BRAND.md) */
    --navy:#0A2644; --navy-deep:#061A30; --gold:#C29B44; --gold-soft:#D9BC7A;
    --cream:#F6F1E7; --muted:rgba(246,241,231,.64); --hair:rgba(194,155,68,.3);
    --fh:'Crimson Pro',Georgia,serif; --fl:'Alexandria',system-ui,sans-serif;
    position:relative; overflow:hidden;
    background:
      radial-gradient(110% 90% at 50% -10%, #123a63 0%, transparent 55%),
      linear-gradient(180deg, var(--navy) 0%, var(--navy-deep) 100%);
    color:var(--cream); font-family:var(--fh);
    padding:clamp(64px,9vw,110px) 22px; text-align:center;
  }
  /* monogram watermark */
  .ks-sig::after{
    content:"KS"; position:absolute; right:-24px; bottom:-70px; pointer-events:none;
    font-family:var(--fh); font-style:italic; font-size:15rem; line-height:1;
    color:rgba(194,155,68,.06);
  }
  .ks-sig__inner{ position:relative; z-index:1; max-width:880px; margin:0 auto; }
  .ks-sig__kicker{
    font-family:var(--fl); font-weight:500; font-size:11.5px; letter-spacing:.4em;
    text-transform:uppercase; color:var(--gold);
  }
  .ks-sig__mark{ margin-top:30px; }
  .ks-sig__mark img{
    width:min(340px,64vw); height:auto; display:inline-block;
    filter:drop-shadow(0 8px 34px rgba(4,16,31,.5));
  }
  .ks-sig__sub{
    font-family:var(--fh); font-weight:300; font-size:clamp(1.05rem,1.9vw,1.2rem);
    color:var(--muted); max-width:52ch; margin:22px auto 0; line-height:1.65;
  }
  .ks-sig__cities{
    display:flex; justify-content:center; align-items:center; gap:16px; flex-wrap:wrap;
    margin:26px 0 0; font-family:var(--fl); font-weight:400; font-size:12px;
    letter-spacing:.26em; text-transform:uppercase; color:var(--gold-soft);
  }
  .ks-sig__cities i{ font-style:normal; color:var(--gold); font-size:.7rem; }
  .ks-sig__grid{
    display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
    max-width:720px; margin:40px auto 0;
  }
  .ks-sig__card{
    position:relative; aspect-ratio:4/3; overflow:hidden;
    border:1px solid rgba(194,155,68,.18); background:#0E3155;
  }
  .ks-sig__card img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
    filter:saturate(.85) brightness(.88); transition:transform .8s cubic-bezier(.22,.61,.2,1);
  }
  .ks-sig__card:hover img{ transform:scale(1.05); }
  .ks-sig__card::after{ content:""; position:absolute; inset:0;
    background:linear-gradient(to top, rgba(6,26,48,.72) 0%, transparent 50%); }
  .ks-sig__name{
    position:absolute; z-index:1; left:12px; right:12px; bottom:10px;
    font-family:var(--fh); font-style:italic; font-weight:500; font-size:.98rem;
    line-height:1.25; color:#fff; text-align:left;
  }
  .ks-sig__btn{
    display:inline-block; margin-top:42px; padding:17px 36px;
    font-family:var(--fl); font-weight:500; font-size:12.5px; letter-spacing:.24em;
    text-transform:uppercase; text-decoration:none; color:var(--navy);
    background:var(--gold); border:1px solid var(--gold); border-radius:0;
    transition:background .25s, border-color .25s, transform .25s;
  }
  .ks-sig__btn:hover{ background:var(--gold-soft); border-color:var(--gold-soft); transform:translateY(-2px); }
  .ks-sig__eta{
    display:block; margin-top:16px; font-family:var(--fl); font-weight:300;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted);
  }
  @media (max-width:640px){ .ks-sig__grid{ grid-template-columns:repeat(3,1fr); gap:8px; } }
  @media (max-width:480px){ .ks-sig__grid{ grid-template-columns:1fr 1fr; }
    .ks-sig__card:nth-child(3){ display:none; } }
  @media (prefers-reduced-motion: reduce){
    .ks-sig__card:hover img{ transform:none; } .ks-sig__btn:hover{ transform:none; }
  }
  </style>

  <script>
  (function () {
    var root = document.getElementById('signature');

    /* tujuan tombol: KS_CONFIG.SIGNATURE_URL (produksi WordPress) →
       fallback path relatif repo (preview GitHub Pages) */
    var url = (window.KS_CONFIG && window.KS_CONFIG.SIGNATURE_URL) || '../signature/index.html';
    root.querySelectorAll('[data-signature-link]').forEach(function (a) { a.href = url; });

    /* strip 3 foto dish signature — opsional, dari KS_MENU.
       Prioritaskan item berfoto resmi (bukan placeholder) agar strip selalu penuh. */
    var grid = root.querySelector('.ks-sig__grid');
    var sig = (window.KS_MENU || []).filter(function (m) { return m.signature; });
    var items = sig.filter(function (m) { return !m.placeholder; })
      .concat(sig.filter(function (m) { return m.placeholder; })).slice(0, 3);
    if (items.length) {
      function esc(s){ return String(s||'').replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];}); }
      grid.innerHTML = items.map(function (m) {
        var ph = m.placeholder ? ' data-placeholder="true"' : '';
        return '<figure class="ks-sig__card" style="margin:0">' +
          '<img src="' + esc(m.image) + '" alt="' + esc(m.name) + '" loading="lazy"' + ph + ' onerror="this.style.display=\'none\'">' +
          '<figcaption class="ks-sig__name">' + esc(m.name) + '</figcaption></figure>';
      }).join('');
      grid.hidden = false;
    }
  })();
  </script>
</section>
